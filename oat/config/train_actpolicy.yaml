defaults:
  - _self_
  - task/policy: libero/libero10

name: train_actpolicy
_target_: oat.workspace.train_policy.TrainPolicyWorkspace

seed: 42
horizon: 16          # == ACT chunk size (num_queries)
n_action_steps: 8    # receding horizon, matches diffpolicy/flowpolicy
n_obs_steps: 1       # ACT is single-frame
task_name: ${task.policy.name}
shape_meta: ${task.policy.shape_meta}

policy:
  _target_: oat.policy.actpolicy.ACTPolicy

  shape_meta: ${shape_meta}
  horizon: ${horizon}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}

  # ACT / DETR-VAE params (ACT README defaults, chunk adapted to ${horizon})
  hidden_dim: 512
  dim_feedforward: 3200
  enc_layers: 4
  # upstream ACT configures dec_layers=7, but only the first decoder layer's
  # output is used or trained (the hs[0] quirk); 1 is functionally identical
  # and avoids DDP unused-parameter errors.
  dec_layers: 1
  nheads: 8
  dropout: 0.1
  latent_dim: 32
  kl_weight: 10.0
  backbone: resnet18
  pre_norm: False

  # ACT temporal ensembling (if True, set n_action_steps: 1)
  temporal_ensemble: False
  temporal_ensemble_k: 0.01

training:
  resume: True
  allow_bf16: True
  max_grad_norm: 1.0
  num_epochs: 5001
  val_every: 10
  sample_every: 10
  rollout_every: 100
  checkpoint_every: 10
  lr_scheduler: constant   # upstream ACT: constant lr, no scheduler
  lr_warmup_steps: 100
  gradient_accumulate_every: 1
  max_train_steps: null
  max_val_steps: null
  max_reconst_steps: null
  seed: ${seed}
  use_ema: True            # oat-baseline consistency (upstream ACT has no EMA)
  num_demo: 500
  tqdm_interval_sec: 1.0

ema:
  _target_: oat.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

optimizer:
  # upstream ACT: lr 1e-5 / lr_backbone 1e-5 at batch size 8; policy_lr is
  # scaled here for batch size 64 (set 1.0e-5 for the literal paper value).
  policy_lr: 1.0e-4
  obs_enc_lr: 1.0e-5       # -> ResNet backbone param group (ACT lr_backbone)
  weight_decay: 1.0e-4     # upstream ACT default (applied to all params)
  betas: [0.9, 0.999]      # AdamW default, as upstream

dataloader:
  batch_size: 64
  num_workers: 4
  shuffle: True
  pin_memory: True
  persistent_workers: True
  drop_last: True

val_dataloader:
  batch_size: 64
  num_workers: 4
  shuffle: False
  pin_memory: True
  persistent_workers: True
  drop_last: True

logging:
  project: oat_dev
  resume: True
  mode: online
  name: ${now:%Y%m%d.%H%M%S}_${name}_${task_name}_N${training.num_demo}
  tags: ["${name}", "${task_name}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: mean_success_rate
    mode: max
    k: 3
    format_str: "ep-{epoch:04d}_sr-{mean_success_rate:.3f}.ckpt"
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: output/${now:%Y%m%d}/${now:%H%M%S}_${name}_${task_name}_N${training.num_demo}
  wandb_name_base: ${now:%Y%m%d.%H%M%S}_${name}_${task_name}_N${training.num_demo}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: output/${now:%Y%m%d}/${now:%H%M%S}_${name}_${task_name}_N${training.num_demo}
  sweep:
    dir: output/${now:%Y%m%d}/${now:%H%M%S}_${name}_${task_name}_N${training.num_demo}
    subdir: ${hydra.job.num}
