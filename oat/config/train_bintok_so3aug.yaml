defaults:
  - _self_
  - task/tokenizer: libero/libero10

name: train_bintok_so3aug
_target_: oat.workspace.train_bintok_so3aug.TrainBinTokSO3AugWorkspace

seed: 42
horizon: 32
task_name: ${task.tokenizer.name}

tokenizer:
  _target_: oat.tokenizer.bin.tokenizer_so3_aug.BinTokSO3Aug
  min_val: -1.0
  max_val: 1.0
  num_bins: 256

  action_aug:
    _target_: oat.tokenizer.oat.augment.so3_action_chunk_aug.SO3ActionChunkAug
    p: 1
    # max_angle_deg: 10.0
    max_angle_deg: 30.0
    # max_angle_deg: 60.0
    mode: left_noise
    augment_position: false
    pos_start: 0
    pos_end: 3
    rot_start: 3
    rot_end: 6

training:
  max_reconst_steps: null
  seed: ${seed}
  num_demo: 500
  tqdm_interval_sec: 1.0

val_dataloader:
  batch_size: 256
  num_workers: 4
  shuffle: False
  pin_memory: True
  persistent_workers: True
  drop_last: True

checkpoint:
  topk:
    monitor_key: test_reconst_mse
    mode: min
    k: 3
    format_str: 'mse-{test_reconst_mse:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: output/${now:%Y%m%d}/${now:%H%M%S}_${name}_${task_name}_N${training.num_demo}
  wandb_name_base: ${now:%Y%m%d.%H%M%S}_${name}_${task_name}_N${training.num_demo}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: output/${now:%Y%m%d}/${now:%H%M%S}_${name}_${task_name}_N${training.num_demo}
  sweep:
    dir: output/${now:%Y%m%d}/${now:%H%M%S}_${name}_${task_name}_N${training.num_demo}
    subdir: ${hydra.job.num}
