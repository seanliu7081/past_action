# train_oattok_vq.yaml
# ─────────────────────────────────────────────────────
# OATTok with vanilla VQ-VAE quantizer (EMA codebook).
# Matches FSQ capacity exactly: K=5000, D=5.
# Drop-in ablation against train_oattok.yaml.
# ─────────────────────────────────────────────────────

defaults:
  - _self_
  - task/tokenizer: libero/libero10

name: train_oattok_vq
_target_: oat.workspace.train_oattok.TrainOATTokWorkspace

seed: 42
horizon: 16
task_name: ${task.tokenizer.name}
action_dim: ${task.tokenizer.shape_meta.action.shape[0]}

# Match FSQ exactly: latent_dim 5, codebook 8*5*5*5*5 = 5000.
latent_dim: 5

tokenizer:
  _target_: oat.tokenizer.oat.tokenizer_vq.OATTokVQ

  encoder:
    _target_: oat.tokenizer.oat.encoder.register_encoder.RegisterEncoder
    sample_dim: ${action_dim}
    sample_horizon: ${horizon}
    emb_dim: 256
    head_dim: 64
    depth: 2
    pdropout: 0.1
    latent_dim: ${latent_dim}
    num_registers: 8

  decoder:
    _target_: oat.tokenizer.oat.decoder.single_pass_decoder.SinglePassDecoder
    sample_dim: ${action_dim}
    sample_horizon: ${horizon}
    emb_dim: 256
    head_dim: 64
    depth: 4
    pdropout: 0.1
    token_dropout_mode: 'pow2'
    latent_dim: ${latent_dim}
    latent_horizon: ${tokenizer.encoder.num_registers}
    use_causal_decoder: true

  # ── KEY CHANGE: vanilla VQ instead of FSQ ────────────
  quantizer:
    _target_: oat.tokenizer.oat.quantizer.vq.VQ
    codebook_size: 5000
    dim: ${latent_dim}
    commitment_beta: 0.25
    ema_decay: 0.99
    ema_eps: 1.0e-5
    dead_code_threshold: 1.0
    use_ema: true


training:
  resume: True
  allow_bf16: True
  max_grad_norm: 1.0
  num_epochs: 5001
  checkpoint_every: 10
  val_every: 10
  sample_every: 10
  lr_scheduler: constant
  lr_warmup_steps: 100
  gradient_accumulate_every: 1
  max_train_steps: null
  max_val_steps: null
  max_reconst_steps: null
  seed: ${seed}
  use_ema: True
  num_demo: 500
  tqdm_interval_sec: 1.0

ema:
  _target_: oat.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

optimizer:
  learning_rate: 5.0e-5
  weight_decay: 0.0
  betas: [0.9, 0.95]

dataloader:
  batch_size: 256
  num_workers: 4
  shuffle: True
  pin_memory: True
  persistent_workers: True
  drop_last: True

val_dataloader:
  batch_size: 256
  num_workers: 4
  shuffle: False
  pin_memory: True
  persistent_workers: True
  drop_last: True

logging:
  project: oat_dev
  resume: True
  mode: online
  name: ${now:%Y%m%d.%H%M%S}_${name}_${task_name}_N${training.num_demo}
  tags: ["${name}", "${task_name}", "vq"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: test_reconst_mse
    mode: min
    k: 3
    format_str: 'ep-{epoch:04d}_mse-{test_reconst_mse:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: output/${now:%Y%m%d}/${now:%H%M%S}_${name}_${task_name}_N${training.num_demo}
  wandb_name_base: ${now:%Y%m%d.%H%M%S}_${name}_${task_name}_N${training.num_demo}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: output/${now:%Y%m%d}/${now:%H%M%S}_${name}_${task_name}_N${training.num_demo}
  sweep:
    dir: output/${now:%Y%m%d}/${now:%H%M%S}_${name}_${task_name}_N${training.num_demo}
    subdir: ${hydra.job.num}
